plugins {
    id 'fabric-loom' version '1.11.8'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    maven { name = 'CentralMirror'; url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
}
loom {
    splitEnvironmentSourceSets()
    mods {
        "hollowbell" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        gametest {
            server()
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dhollowbell.debug=true"
            // (a CPU profile of the run, for making him cheaper: -Pjfr=/some/file.jfr)
            if (project.findProperty("jfr")) vmArg "-XX:StartFlightRecording=filename=" + project.findProperty("jfr") + ",settings=" + (project.findProperty("jfc") ?: "profile")
            vmArg "-Xmx3G"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-report.xml"
            runDir "build/gametest"
        }
        autotest {
            client()
            name "Auto Test"
            vmArg "-Dhollowbell.autotest=${project.projectDir}/" + (project.findProperty("script") ?: "tools/autotest.txt")
            vmArg "-Xmx6G"
            programArgs "--width", "1280", "--height", "720"
            runDir "build/autotest"
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
// the game test classes; ./gradlew runGametest -Ponly=SolidTests,PushOutTests runs just those
def allTests = [
    'net.jj.hollowbell.test.HollowbellGameTests',
    'net.jj.hollowbell.test.SolidTests',
    'net.jj.hollowbell.test.PushOutTests',
    'net.jj.hollowbell.test.SitTests',
    'net.jj.hollowbell.test.GiantHullTests'
]
// timings only, run on their own: ./gradlew runGametest -Ponly=TickCostTests (a full-size fight in the middle of the
// suite would shift every later test's world and dice)
def labTests = [
    'net.jj.hollowbell.test.TickCostTests'
]
def onlyTests = project.findProperty('only')
def tests = !onlyTests ? allTests :
        (allTests + labTests).findAll { t -> onlyTests.toString().split(',').any { t.endsWith('.' + it) } }
processResources {
    inputs.property "version", project.version
    inputs.property "gametests", tests.join(',')
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "gametests": groovy.json.JsonOutput.toJson(tests)
    }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }

// Maven Central rate-limits the cloud machine, so use Google's mirror of it instead.
afterEvaluate {
    repositories.removeIf { it instanceof MavenArtifactRepository && it.url.toString().contains("repo.maven.apache.org") }
}
