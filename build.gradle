plugins {
    id 'fabric-loom' version '1.11.8'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    maven { name = 'CentralMirror'; url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
}
// the autotest script: -Pscript=tools/<script>.txt (read straight from the command line: findProperty("script")
// always came out empty, so the default script ran whatever was asked)
def autotestScript = gradle.startParameter.projectProperties.script ?: "tools/autotest.txt"
loom {
    splitEnvironmentSourceSets()
    mods {
        "hollowbell" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        gametest {
            server()
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dhollowbell.debug=true"
            vmArg "-Xmx3G"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-report.xml"
            runDir "build/gametest"
        }
        autotest {
            client()
            name "Auto Test"
            vmArg "-Dhollowbell.autotest=${project.projectDir}/${autotestScript}"
            vmArg "-Xmx6G"
            programArgs "--width", "1280", "--height", "720"
            runDir "build/autotest"
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }

// Maven Central rate-limits the cloud machine, so use Google's mirror of it instead.
afterEvaluate {
    repositories.removeIf { it instanceof MavenArtifactRepository && it.url.toString().contains("repo.maven.apache.org") }
}

// Draws the Bell Hollows without the game, from the real plan, into pictures/ground/ (map, den, samples).
// Development only, never in the jar: ./gradlew groundLab   (or -Plab="map" / "den" / "sample")
jar { exclude 'net/jj/hollowbell/lab/**' }
tasks.register('groundLab', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.jj.hollowbell.lab.GroundLab'
    workingDir = projectDir
    args = (project.findProperty('lab') ?: 'all').toString().split(' ').toList()
    jvmArgs '-Xmx3g', '-Djava.awt.headless=true'
}

// Pose lab: runs his animation offline in every pose and move and measures blocks cut off or coming apart
// (build/poselab). Development only, never in the jar: ./gradlew poseLab -Plab="idle arm_slam" -Pshots=1
tasks.register('poseLab', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.jj.hollowbell.lab.PoseLab'
    workingDir = projectDir
    args = (project.findProperty('lab') ?: 'all').toString().split(' ').toList()
    jvmArgs '-Xmx3g', '-Djava.awt.headless=true'
    if (project.hasProperty('shots')) systemProperty 'lab.shots', project.property('shots')
    if (project.hasProperty('out')) systemProperty 'lab.out', project.property('out')
}
// Solid lab: his solid shape (what's filled in, the dome still hollow) and how much his parts pass into each other in
// every move (build/solidlab). Development only: ./gradlew solidLab -Plab="solid overlap" -Pshots=1
tasks.register('solidLab', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.jj.hollowbell.lab.SolidLab'
    workingDir = projectDir
    args = (project.findProperty('lab') ?: 'solid overlap').toString().split(' ').toList()
    jvmArgs '-Xmx3g', '-Djava.awt.headless=true'
    if (project.hasProperty('shots')) systemProperty 'lab.shots', 'true'
    if (project.hasProperty('out')) systemProperty 'lab.out', project.property('out')
}
tasks.register('poseLabClasspath') {
    dependsOn 'classes'
    doLast { new File(buildDir, 'poselab-cp.txt').text = sourceSets.main.runtimeClasspath.asPath }
}
