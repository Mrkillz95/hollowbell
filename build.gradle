plugins {
    id 'fabric-loom' version '1.11.8'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    maven { name = 'CentralMirror'; url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
}
loom {
    splitEnvironmentSourceSets()
}
// the game tests, the labs and the autotest live in their own source sets, so they never go in the jar
sourceSets {
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
    gametestClient {
        compileClasspath += client.compileClasspath + client.output + main.output + gametest.output
        runtimeClasspath += client.runtimeClasspath + client.output + main.output + gametest.output
    }
}
loom {
    mods {
        "hollowbell" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        "hollowbell-gametest" {
            sourceSet sourceSets.gametest
            sourceSet sourceSets.gametestClient
        }
    }
    runs {
        gametest {
            server()
            name "Game Test"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dhollowbell.debug=true"
            vmArg "-Xmx3G"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-report.xml"
            runDir "build/gametest"
        }
        autotest {
            client()
            name "Auto Test"
            source sourceSets.gametestClient
            def script = project.findProperty("script") ?: "tools/autotest.txt"
            vmArg "-Dhollowbell.autotest=${project.projectDir}/" + script
            vmArg "-Xmx6G"
            // -PgroundAt=x,z: his ground put there in a new normal world, laid out from the world seed
            if (project.hasProperty("groundAt")) vmArg "-Dhollowbell.groundAt=" + project.property("groundAt")
            programArgs "--width", "1280", "--height", "720"
            runDir "build/autotest"
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // -Pgiants: the other giants loaded too (copies of their released jars in run-mods/, never committed), to try
    // /giants and the meetings with all of them in the dev game
    if (project.hasProperty('giants')) fileTree(dir: 'run-mods', include: '*.jar').each { modLocalRuntime files(it) }
}
