// The Giants Guide: a small mod (id jj_giants) that is the base of the all-in-one jar. It shows a book about every
// giant that is installed. tools/bundle/make_bundle.py takes the jar built here and puts the giant jars inside it.
plugins {
    id 'fabric-loom' version '1.11.8'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    maven { name = 'CentralMirror'; url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
}
loom {
    splitEnvironmentSourceSets()
    mods {
        "jj_giants" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        gametest {
            server()
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Xmx3G"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-report.xml"
            runDir "build/gametest"
        }
        autotest {
            client()
            name "Auto Test"
            vmArg "-Djj_giants.autotest=${project.projectDir}/" + (project.findProperty("script") ?: "tools/autotest.txt")
            vmArg "-Xmx4G"
            programArgs "--width", "1280", "--height", "720"
            runDir "build/autotest"
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // -Pgiants: the six giants loaded too (copies of their released jars in run-mods/, made by
    // tools/giant_mods.py without their own game tests), for the tests and pictures that need them.
    if (project.hasProperty('giants')) fileTree(dir: 'run-mods', include: '*.jar').each { modLocalRuntime files(it) }
}
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }

// Maven Central rate-limits the cloud machine, so use Google's mirror of it instead.
afterEvaluate {
    repositories.removeIf { it instanceof MavenArtifactRepository && it.url.toString().contains("repo.maven.apache.org") }
}
