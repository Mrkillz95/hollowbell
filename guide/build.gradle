// The Giants Guide: a small mod (id jj_giants) that is the base of the all-in-one jar. It shows a book about every
// giant that is installed. tools/bundle/make_bundle.py takes the jar built here and puts the giant jars inside it.
plugins {
    id 'fabric-loom' version '1.11.8'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    maven { name = 'CentralMirror'; url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
}
loom {
    splitEnvironmentSourceSets()
}
// the game tests and the autotest live in their own source sets, so they never go in the jar
sourceSets {
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
    gametestClient {
        compileClasspath += client.compileClasspath + client.output + main.output + gametest.output
        runtimeClasspath += client.runtimeClasspath + client.output + main.output + gametest.output
    }
}
loom {
    mods {
        "jj_giants" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        "jj_giants-gametest" {
            sourceSet sourceSets.gametest
            sourceSet sourceSets.gametestClient
        }
    }
    runs {
        gametest {
            server()
            name "Game Test"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Xmx3G"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-report.xml"
            runDir "build/gametest"
        }
        autotest {
            client()
            name "Auto Test"
            source sourceSets.gametestClient
            vmArg "-Djj_giants.autotest=${project.projectDir}/" + (project.findProperty("script") ?: "tools/autotest.txt")
            vmArg "-Xmx4G"
            programArgs "--width", "1280", "--height", "720"
            runDir "build/autotest"
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // -Pgiants: the giants loaded too (copies of their released jars in run-mods/, made by tools/giant_mods.py
    // without their own game tests), for the tests and pictures that need them
    if (project.hasProperty('giants') || project.hasProperty('duels')) fileTree(dir: 'run-mods', include: '*.jar').each { modLocalRuntime files(it) }
}
// -Pduels: the giant-vs-giant duel harness (src/duels, handoff DUELS.md), its own source set and run, so it is
// never part of the normal game tests or the jar. Runs with the eight giants from run-mods/:
//   gradlew runDuels -Pduels -Pduel_runs=2 -Pduel_seconds=240   (every -Pduel_x=v is passed on as -Djj.duel.x=v)
// One server holds about 20 full-size duels before its memory runs out: run big sweeps a few pairs at a time
// (tools/duel_sweep.ps1, which can also run shards side by side), each run adds its rows to the same CSV.
// -PduelHeap=4G sets the server's memory (6G by default).
if (project.hasProperty('duels')) {
    sourceSets {
        duels {
            compileClasspath += main.compileClasspath + main.output
            runtimeClasspath += main.runtimeClasspath + main.output
        }
    }
    loom {
        mods { "jj_giants-duels" { sourceSet sourceSets.duels } }
        runs {
            duels {
                server()
                name "Giant Duels"
                source sourceSets.duels
                vmArg "-Dfabric-api.gametest"
                vmArg "-Xmx${project.findProperty('duelHeap') ?: '6G'}"
                vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/duels-report.xml"
                project.properties.findAll { it.key.startsWith('duel_') }.each { k, v -> vmArg "-Djj.duel.${k.substring(5)}=${v}" }
                runDir "build/duels"
            }
        }
    }
    // a fresh world and fresh giant configs every run (tuned values must never stick)
    tasks.matching { it.name == 'runDuels' }.configureEach {
        doFirst { delete "build/duels/gametestworld", "build/duels/config", "build/duels/world" }
    }
}
tasks.matching { it.name in ['processResources', 'processGametestResources', 'processDuelsResources'] }.configureEach {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }

// Google's mirror of Maven Central, in place of the main one
afterEvaluate {
    repositories.removeIf { it instanceof MavenArtifactRepository && it.url.toString().contains("repo.maven.apache.org") }
}
